name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          want="avdslim ${GITHUB_REF_NAME#v}"
          got="$(./avdslim version)"
          [ "$got" = "$want" ] || { echo "::error::tag says '$want', script says '$got'"; exit 1; }

      - name: Lint and test
        run: |
          brew install shellcheck
          make check

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" avdslim --generate-notes --verify-tag
